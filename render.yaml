services:
  - type: web
    name: camila-os-core
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OC_DIR
        value: "/opt/render/project/src"
      - key: CAMILA_OC_DIR
        value: "/opt/render/project/src"

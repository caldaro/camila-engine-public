[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camila-mcp-server"
version = "0.1.0"
description = "Servidor MCP de Camila para control de voz emocional, inferencia en Colab (XTTS-v2) y marketing OS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Adam (Engineering) & Camila (Creative)", email = "engineering@novasedan.com" },
]
dependencies = [
    "fastmcp>=0.1.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "edge-tts>=6.1.0",
]

[project.scripts]
camila-mcp = "camila_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camila_mcp"]
